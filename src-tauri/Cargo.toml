[package]
name = "genshin-guide-overlay"
version = "0.1.10"
description = "Always-on-top guide browser for borderless games"
authors = ["renlong"]
edition = "2021"

[lib]
name = "genshin_guide_overlay_lib"
crate-type = ["lib"]

[[bin]]
name = "GenshinGuideOverlay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "query", "native-tls"] }
tauri = { version = "=2.11.5", features = ["tray-icon", "unstable"] }
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-single-instance = "=2.4.3"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
