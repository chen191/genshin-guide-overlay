<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>原神攻略悬浮窗</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { display: grid; place-items: center; min-height: 100vh; padding: 26px;
        color: #eaf1fb; background: radial-gradient(circle at top, #293b56, #101722 70%);
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; }
      main { width: min(90%, 620px); padding: 26px; border: 1px solid #49617f;
        border-radius: 16px; background: rgba(13, 21, 33, .9); box-shadow: 0 20px 48px #0008; }
      h1 { margin: 0 0 14px; font-size: 24px; }
      p { margin: 9px 0; color: #bac7d9; line-height: 1.65; }
      kbd { padding: 2px 7px; border: 1px solid #607491; border-radius: 5px;
        background: #202f44; color: white; }
      strong { color: #78c2ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>原神攻略悬浮窗</h1>
      <p>在顶部直接搜索 B 站攻略，也可输入 BV 号或粘贴网址。</p>
      <p><kbd>F8</kbd> 暂停/继续　<kbd>Ctrl+Alt+O</kbd> 显示/隐藏</p>
      <p><kbd>Ctrl+Alt+L</kbd> 锁定/解锁鼠标穿透</p>
      <p><strong>请将游戏设为无边框或窗口化。</strong>普通置顶窗口不保证能覆盖真正的独占全屏。</p>
    </main>
  </body>
</html>
